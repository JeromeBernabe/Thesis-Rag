<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `%BASE_URL%` rather than a bare "/favicon.svg": the production build sets
      `base: './'` so assets load over the Tauri asset protocol, where a
      root-absolute path would miss.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>RAG Benchmark Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
