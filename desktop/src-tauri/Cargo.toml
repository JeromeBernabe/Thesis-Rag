[package]
name = "thesis-rag-bench"
version = "0.1.0"
description = "Desktop benchmark console for the DQN-Enhanced RAG experiment"
authors = ["Johann"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "thesis_rag_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
