[pytest]
testpaths = bench_bridge/tests
python_files = test_*.py
addopts = --strict-markers
filterwarnings =
    error
    # The test fixtures feed paired t-tests perfectly constant values, which is
    # the clean case but makes scipy warn about catastrophic cancellation. The
    # warning is correct about the numerics and irrelevant to what is asserted,
    # so it is downgraded rather than repeated in every affected test.
    ignore:Precision loss occurred in moment calculation:RuntimeWarning
    # The sidecar imports torch for its settings module even on the dry-run path;
    # that import is not what these tests exercise.
    ignore::DeprecationWarning